# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Library coordinates for Maven Central publishing.
# Consumed by aui-core and aui-compose build files.
GROUP=com.bennyjon
VERSION_NAME=0.1.0-alpha01

# vanniktech-maven-publish target. SonatypeHost.CENTRAL_PORTAL is the new
# central.sonatype.com endpoint; signing is required for releases.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

# Shared POM metadata. Picked up automatically by vanniktech-maven-publish
# for every module that applies the plugin. Per-module values
# (POM_ARTIFACT_ID, POM_NAME, POM_DESCRIPTION) live in each module's own
# gradle.properties.
POM_URL=https://github.com/benny-jon/aui-android

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=bennyjon
POM_DEVELOPER_NAME=Benny Jon
POM_DEVELOPER_URL=https://github.com/benny-jon

POM_SCM_URL=https://github.com/benny-jon/aui-android
POM_SCM_CONNECTION=scm:git:git://github.com/benny-jon/aui-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/benny-jon/aui-android.git
